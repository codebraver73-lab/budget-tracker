<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div id="budgetdiv">
        <div>
           <div id="my-budget-div">
            <p>MY BUDGET💵</p>
           </div>
           <div id="new-entry-div">
            <p style="margin-bottom:1vh;">New Entry</p>
           </div>
           <div>
            <div id="description-div"> 
               <p>Description</p>
               <input placeholder="Enter text.." type="text">
            </div>
            <div id="amount-div">
              <p>Amount(+/-)</p>
              <input placeholder="Enter value" type="text"/>
            </div>
           <button id="transaction-button">ADD TRANSACTION</button>
            <div id="money-info-div">
              <div id="inflow-div">
                <p style="margin-top: 0px;">INFLOW</p>
                <p id="inflowmoney">4000$</p>
              </div>
              <div id="outflow-div">
                <p style="margin-top: 0px;">OUTFLOW</p>
                <p id="outflow-money">1000$</p>
              </div>
              <div id="Balance-div">
                 <p style="margin-top: 0px;">BALANCE</p>
                 <p id="Balance-money"> 3000$</p>
              </div>
            </div>     
            <div id="history-div">
                <p style="margin-bottom:1vh;">History</p>
            </div>
         </div>
        </div> 
    </div>
  <script src="script.js"></script>
</body>
</html>
